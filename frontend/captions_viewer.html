<body class="bg-neutral-950 text-neutral-100 antialiased p-3 sm:p-6 min-h-screen">
  <div class="max-w-3xl mx-auto space-y-4">

  <script>
    const episodes = [
      {
        ep: "EP42",
        title: "สะพานโอเวอร์ทาวน์ ปริศนาสะพานที่สุนัขกระโดดลงเหวนับร้อยตัว",
        yearPlace: "ตั้งแต่ทศวรรษ 1950 ณ เมืองดัมบาร์ตัน ประเทศสกอตแลนด์",
        keywords: "42 ep42 overtoun bridge โอเวอร์ทาวน์ สะพาน สุนัข หมา กระโดด สกอตแลนด์ ดัมบาร์ตัน มิงค์",
        text: `สะพานโอเวอร์ทาวน์ ปริศนาสะพานที่สุนัขกระโดดลงเหวนับร้อยตัว

สะพานโอเวอร์ทาวน์ (Overtoun Bridge) เป็นสะพานหินโค้งสไตล์โกธิก สร้างเสร็จในปี 1895 ใกล้เมืองดัมบาร์ตัน ประเทศสกอตแลนด์ ออกแบบโดยสถาปนิกภูมิทัศน์ เฮนรี เออร์เนสต์ มิลเนอร์ เพื่อเป็นทางเข้าสู่คฤหาสน์โอเวอร์ทาวน์ ตัวสะพานทอดข้ามลำธารโอเวอร์ทาวน์ที่อยู่ลึกลงไปราว 15 เมตร

ตั้งแต่ราวทศวรรษ 1950 เป็นต้นมา มีรายงานว่าสุนัขหลายร้อยตัวกระโดดข้ามกำแพงสะพานลงไปสู่โขดหินด้านล่าง บางแหล่งประเมินว่ามีมากถึงราว 600 ตัว และเสียชีวิตไปประมาณ 50 ตัว จุดที่น่าสนใจคือเหตุการณ์มักเกิดขึ้นที่ตำแหน่งเดิมบนฝั่งขวาของสะพาน ในวันที่อากาศแจ่มใส และสุนัขที่กระโดดส่วนใหญ่เป็นสายพันธุ์จมูกยาวที่ประสาทรับกลิ่นไว เช่น คอลลี่ ลาบราดอร์ และรีทรีฟเวอร์ บางตัวที่รอดชีวิตยังวิ่งกลับขึ้นมากระโดดซ้ำอีกครั้ง

ชาวบ้านในพื้นที่เคยเชื่อว่าสะพานแห่งนี้ต้องคำสาป หรือมีวิญญาณ สตรีสีขาวแห่งโอเวอร์ทาวน์ คอยล่อลวงสัตว์เลี้ยง จนนักพฤติกรรมสัตว์ เดวิด แซนด์ส เข้ามาตรวจสอบในช่วงกลางทศวรรษ 2000 เขาตัดประเด็นเรื่องเสียงและภาพออกไป และพบว่าบริเวณใต้สะพานมีตัวมิงค์อาศัยอยู่ ซึ่งเป็นสัตว์ที่มีกลิ่นสาบรุนแรง เมื่อทดลองนำกลิ่นมิงค์ไปให้สุนัขดม สุนัขส่วนใหญ่ตอบสนองอย่างรุนแรง

นักวิจัยจึงสันนิษฐานว่ากำแพงหินทึบของสะพานบดบังไม่ให้สุนัขมองเห็นความลึกด้านล่าง เมื่อได้กลิ่นสัตว์ป่าลอยขึ้นมา สัญชาตญาณนักล่าทำให้พวกมันพุ่งข้ามกำแพงไปโดยไม่รู้ว่าเบื้องล่างคือเหวลึก ปัจจุบันบริเวณสะพานมีป้ายเตือนให้เจ้าของจูงสุนัขด้วยสายจูงทุกครั้งที่เดินผ่าน

#NOKTAMRA #OvertounBridge #สะพานโอเวอร์ทาวน์ #สกอตแลนด์ #ปริศนาโลก #เรื่องจริง #สุนัข #ประวัติศาสตร์โลก #เรื่องแปลกนอกตำรา #ReelsTH #สารคดี`
      },
      {
        ep: "EP41",
        title: "นครใต้ดินเดรินกูยู เมืองลี้ลับ 18 ชั้นที่ซ่อนมนุษย์ได้กว่า 20,000 คน",
        yearPlace: "ค้นพบปี 1963 ณ แคว้นคัปปาโดเกีย ประเทศตุรกี",
        keywords: "41 ep41 เดรินกูยู derinkuyu นครใต้ดิน คัปปาโดเกีย ตุรกี เมืองใต้ดิน 18 ชั้น",
        text: `นครใต้ดินเดรินกูยู เมืองลี้ลับ 18 ชั้นที่ซ่อนมนุษย์ได้กว่า 20,000 คน

ในปี 1963 ระหว่างที่ชายชาวตุรกีในแคว้นคัปปาโดเกียกำลังทุบกำแพงห้องใต้ดินเพื่อต่อเติมบ้าน เขาได้ค้นพบทางเดินลึกลับที่ทอดยาวลึกลงไปใต้พิภพ นำไปสู่การค้นพบนครใต้ดินโบราณ เดรินกูยู (Derinkuyu) ที่มีความลึกถึง 18 ชั้น ดิ่งลงไปใต้ดินกว่า 85 เมตร

เมืองใต้ดินแห่งนี้ถูกออกแบบอย่างน่าอัศจรรย์ด้วยระบบวิศวกรรมโบราณ มีปล่องระบายอากาศขนาดใหญ่กว่า 15,000 จุด ที่สามารถดึงอากาศบริสุทธิ์จากผิวดินลงไปหล่อเลี้ยงจนถึงชั้นลึกที่สุด ภายในประกอบด้วยสิ่งอำนวยความสะดวกครบครัน ทั้งห้องพัก คอกสัตว์ โรงเก็บไวน์ โรงบ่มน้ำมัน โบสถ์ และโรงเรียน สามารถรองรับประชากรได้มากถึง 20,000 คน ให้หลบซ่อนและใช้ชีวิตได้นานหลายเดือน

เส้นทางเข้าออกแต่ละชั้นถูกตัดขาดด้วยประตูดิสก์หินขนาดยักษ์ หนักกว่า 500 กิโลกรัม ที่สามารถกลิ้งปิดผนึกและล็อคได้จากด้านในเท่านั้น เพื่อป้องกันการรุกรานจากกองทัพข้าศึกในยุคสงคราม ปัจจุบัน นครใต้ดินเดรินกูยูยังคงเป็นหนึ่งในสิ่งก่อสร้างโบราณที่มหัศจรรย์และซับซ้อนที่สุดในประวัติศาสตร์โลก

#NOKTAMRA #Derinkuyu #เดรินกูยู #นครใต้ดิน #คัปปาโดเกีย #ตุรกี #โบราณคดี #ประวัติศาสตร์โลก #เรื่องแปลกนอกตำรา #ReelsTH #สารคดี`
      },
      {
        ep: "EP40",
        title: "เสียงที่ดังที่สุดในประวัติศาสตร์โลก ภูเขาไฟกรากะตัวระเบิด 1883",
        yearPlace: "27 สิงหาคม ค.ศ. 1883 ณ ช่องแคบซุนดา ประเทศอินโดนีเซีย",
        keywords: "40 ep40 กรากะตัว krakatoa ภูเขาไฟระเบิด เสียงที่ดังที่สุดในโลก สึนามิ อินโดนีเซีย 1883",
        text: `เสียงที่ดังที่สุดในประวัติศาสตร์โลก การระเบิดของมหาภูเขาไฟกรากะตัว 1883

ในเช้าวันที่ 27 สิงหาคม 1883 ช่องแคบซุนดาระหว่างเกาะชวาและสุมาตรา เกิดการระเบิดครั้งรุนแรงที่สุดในประวัติศาสตร์ยุคใหม่ เมื่อภูเขาไฟกรากะตัวปะทุด้วยพลังงานเทียบเท่าระเบิดทีเอ็นที 200 เมกะตัน หรือรุนแรงกว่าระเบิดปรมาณูที่ฮิโรชิม่าถึง 10,000 เท่า

การระเบิด ณ เวลา 10:02 น. ก่อให้เกิดคลื่นเสียงที่มีระดับความดังสูงถึง 310 เดซิเบล แรงอัดอากาศฉีกแก้วหูกะลาสีเรือที่อยู่ห่างออกไป 64 กิโลเมตรทันที ที่น่าอัศจรรย์คือ คลื่นเสียงเดินทางข้ามมหาสมุทรไปไกลถึงเกาะรอดริเกซในมหาสมุทรอินเดีย และเมืองเพิร์ธ ประเทศออสเตรเลีย ซึ่งอยู่ห่างออกไปเกือบ 4,800 กิโลเมตร โดยผู้คนที่นั่นได้ยินเสียงดังกึกก้องชัดเจนราวกับเสียงปืนใหญ่ เครื่องตรวจวัดความกดอากาศทั่วโลกบันทึกได้ว่า คลื่นกระแทกในชั้นบรรยากาศเดินทางวนรอบโลกถึง 4 รอบเต็มก่อนจะสลายตัว

แรงระเบิดทำให้เกาะภูเขาไฟเดิมจมหายไปในทะเลถึงสองในสาม และก่อให้เกิดคลื่นสึนามิสูงกว่า 30 ถึง 40 เมตร ซัดถล่มชายฝั่ง 165 หมู่บ้าน ส่งผลให้มีผู้เสียชีวิตมากกว่า 36,000 คน นอกจากนี้ เถ้าถ่านและก๊าซซัลเฟอร์ไดออกไซด์ที่พุ่งสูง 80 กิโลเมตรสู่ชั้นบรรยากาศสตราโตสเฟียร์ ได้บดบังแสงอาทิตย์จนทำให้อุณหภูมิเฉลี่ยของโลกลดลง 1.2 องศาเซลเซียสติดต่อกันหลายปี และเปลี่ยนท้องฟ้ายามเย็นทั่วโลกให้กลายเป็นสีแดงฉาน

#NOKTAMRA #Krakatoa #กรากะตัว #ภูเขาไฟระเบิด #เสียงที่ดังที่สุดในโลก #ประวัติศาสตร์โลก #ภัยพิบัติทางธรรมชาติ #วิทยาศาสตร์ #อินโดนีเซีย #ReelsTH #สารคดี`
      },
      {
        ep: "EP39",
        title: "เกาะงูพิษต้องห้าม อิลฮา ดา เกอีมาดา กรังจี บราซิล",
        yearPlace: "มหาสมุทรแอตแลนติก นอกชายฝั่งรัฐเซาเปาลู ประเทศบราซิล",
        keywords: "39 ep39 เกาะงู snake island อิลฮา ดา เกอีมาดา กรังจี บราซิล งูหัวหอกทองคำ พิษละลายเนื้อเยื่อ สัตว์มีพิษ",
        text: `เกาะงูพิษต้องห้าม อิลฮา ดา เกอีมาดา กรังจี ดินแดนที่มีงูพิษหนาแน่นที่สุดในโลก

ห่างจากชายฝั่งรัฐเซาเปาลู ประเทศบราซิล ออกไปราว 33 กิโลเมตร คือที่ตั้งของเกาะอิลฮา ดา เกอีมาดา กรังจี หรือ สเนก ไอลันด์ (Snake Island) ผืนเกาะขนาดเพียง 0.43 ตารางกิโลเมตร ที่ทางการบราซิลออกกฎหมายสั่งห้ามมนุษย์ขึ้นเกาะโดยเด็ดขาด

ย้อนกลับไปเมื่อ 11,000 ปีก่อน ระดับน้ำทะเลที่สูงขึ้นในช่วงสิ้นสุดยุคน้ำแข็งได้ตัดขาดเกาะแห่งนี้ออกจากแผ่นดินใหญ่ งูพิษที่ติดอยู่บนเกาะไม่มีสัตว์เลี้ยงลูกด้วยนมให้ล่า จึงต้องปรับตัวขึ้นไปล่าบนกิ่งไม้และดักกิน นกอพยพ เพื่อความอยู่รอด ส่งผลให้เกิดการวิวัฒนาการทางชีววิทยาจนกลายเป็นสายพันธุ์เฉพาะถิ่นชื่อ งูหัวหอกทองคำ (Golden Lancehead)

ในวันที่ 5 ถึง 9 ธันวาคม 1952 ลอนดอนเผชิญวิกฤตมลพิษครั้งรุนแรงที่สุดในประวัติศาสตร์ หลังจากอังกฤษส่งออกถ่านหินคุณภาพสูงเพื่อฟื้นฟูเศรษฐกิจหลังสงคราม และให้ประชาชนใช้ถ่านหินเกรดต่ำที่มีกำมะถันสูงแทน

เมื่ออากาศหนาวจัดมาเยือน เกิดปรากฏการณ์อุณหภูมิผกผัน (Temperature Inversion) มวลอากาศเย็นถูกกักไว้ใต้ชั้นอากาศอุ่น ควันพิษจากการเผาถ่านหินและก๊าซซัลเฟอร์ไดออกไซด์วันละกว่า 370 ตัน ทำปฏิกิริยากับหมอกจนกลายเป็นละอองกรดกำมะถันปกคลุมทั่วเมือง

หมอกควันหนาทึบจนทัศนวิสัยเป็นศูนย์ ระบบขนส่งหยุดชะงัก ประชาชนสูดละอองกรดเข้าทำลายเนื้อเยื่อปอด ส่งผลให้มีผู้เสียชีวิตทันทีกว่า 4,000 คน และยอดสะสมพุ่งสูงเกิน 12,000 คนในเวลาต่อมา

โศกนาฏกรรมครั้งนี้กลายเป็นจุดเปลี่ยนสำคัญ ผลักดันให้อังกฤษตรากฎหมาย Clean Air Act 1956 เพื่อปฏิรูปการควบคุมมลพิษทางอากาศเป็นแห่งแรกของโลก

#NOKTAMRA #GreatSmog1952 #หมอกควันพิษลอนดอน #ประวัติศาสตร์อังกฤษ #มลพิษทางอากาศ #เรื่องจริงประวัติศาสตร์ #สารคดี #ความรู้รอบตัว #ReelsTH #สาระน่ารู้`
      }
    ];

    let currentIdx = 0;

    function init() {
      renderButtons();
      selectEpisode(0);
    }

    function renderButtons() {
      const container = document.getElementById('epButtonsContainer');
      container.innerHTML = '';
      
      episodes.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.id = `btn-${idx}`;
        btn.className = `text-xs px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:border-yellow-500 font-medium transition cursor-pointer`;
        btn.textContent = item.ep;
        btn.onclick = () => selectEpisode(idx);
        container.appendChild(btn);
      });
    }

    function selectEpisode(idx) {
      currentIdx = idx;
      const data = episodes[idx];
      
      episodes.forEach((_, i) => {
        const b = document.getElementById(`btn-${i}`);
        if (b) {
          if (i === idx) {
            b.className = `text-xs px-2.5 py-1 rounded-lg font-bold border border-yellow-500 bg-yellow-400 text-black shadow-sm transition`;
          } else {
            b.className = `text-xs px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:border-yellow-500 font-medium transition cursor-pointer`;
          }
        }
      });

      document.getElementById('epBadge').textContent = data.ep;
      document.getElementById('epTitle').textContent = data.title;
      document.getElementById('epYearPlace').textContent = data.yearPlace;
      document.getElementById('captionContent').textContent = data.text;
      document.getElementById('currentIndexDisplay').textContent = `${data.ep} (${idx + 1} จาก ${episodes.length})`;

      resetCopyButton();
    }

    function navigateEpisode(direction) {
      let nextIdx = currentIdx + direction;
      if (nextIdx < 0) nextIdx = episodes.length - 1;
      if (nextIdx >= episodes.length) nextIdx = 0;
      selectEpisode(nextIdx);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      
      if (q.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      episodes.forEach((item, idx) => {
        const btn = document.getElementById(`btn-${idx}`);
        const match = item.ep.toLowerCase().includes(q) || 
                      item.title.toLowerCase().includes(q) || 
                      item.keywords.toLowerCase().includes(q) ||
                      item.text.toLowerCase().includes(q);
        
        if (match) {
          btn.style.display = 'inline-block';
        } else {
          btn.style.display = 'none';
        }
      });

      const firstMatchIdx = episodes.findIndex((item) => {
        return item.ep.toLowerCase().includes(q) || 
               item.title.toLowerCase().includes(q) || 
               item.keywords.toLowerCase().includes(q) ||
               item.text.toLowerCase().includes(q);
      });

      if (firstMatchIdx !== -1 && q.length > 0) {
        selectEpisode(firstMatchIdx);
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      episodes.forEach((_, idx) => {
        const btn = document.getElementById(`btn-${idx}`);
        if (btn) btn.style.display = 'inline-block';
      });
      selectEpisode(currentIdx);
    }

    function copyCurrentEpisode() {
      const data = episodes[currentIdx];
      navigator.clipboard.writeText(data.text).then(() => {
        const btn = document.getElementById('copyBtnText');
        btn.textContent = `คัดลอก ${data.ep} เรียบร้อยแล้ว!`;
        setTimeout(resetCopyButton, 2200);
      }).catch(err => {
        alert('คัดลอกไม่สำเร็จ กรุณาลากคลุมดำแล้วกดคัดลอกด้วยตัวเอง');
      });
    }

    function resetCopyButton() {
      const btn = document.getElementById('copyBtnText');
      if (btn) btn.textContent = 'คัดลอกทั้งกล่อง (พร้อมลง Reel)';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
